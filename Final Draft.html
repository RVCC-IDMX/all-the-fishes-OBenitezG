<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All the Fishes</title>
    <script src = "https://pixijs.download/release/pixi.js"></script>
</head>
<body>
    
    <script type = "module">

        const CANVAS_WIDTH  =   640
        const CANVAS_HEIGHT =   480

        class GoldFish {

            constructor() {

                let MIN_size = 0.8
                let MAX_size = 1.2

                this.fish = PIXI.Sprite.from("img/Goldfish.png")
                    this.fish.scale.set(Math.random() * (MAX_size - MIN_size) + MIN_size)
                    this.fish.x = Math.random() * CANVAS_WIDTH
                    this.fish.y = Math.random() * CANVAS_HEIGHT

                app.stage.addChild(this.fish)

            }
            
            behavior(counter) {
                this.fish.y = (Math.sin(counter/40) * 30) + 200
            }

        }


        const app = new PIXI.Application()
        await app.init({
            width: CANVAS_WIDTH,
            height: CANVAS_HEIGHT,
            backgroundColor: 0x000000
        })

        document.body.appendChild(app.canvas)

        window.app = app

        // Load Images
        await PIXI.Assets.load("img/Goldfish.png")

        // Create and Draw Background

        // Create Actors
        var gold_fish = new GoldFish()

        // Create abd Draw Forground

        let counter = 0

        function loop() {
            counter++

            gold_fish.behavior(counter)

            requestAnimationFrame(loop)
        }

        loop()

    </script>

</body>
</html>
