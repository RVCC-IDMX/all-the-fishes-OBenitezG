<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All the Fishes</title>
    <script src = "https://pixijs.download/release/pixi.js"></script>
</head>
<body>
    
    <script type = "module">

        var randomColor = []

        const app = new PIXI.Application()
        await app.init({
            width: 640,
            height: 480,
            backgroundColor: 0x000000
        })

        document.body.appendChild(app.canvas)

        window.app = app

        await PIXI.Assets.load("img/goldfish_PNG12.png")

        let fish1 = PIXI.Sprite.from("img/goldfish_PNG12.png")
            fish1.scale.set(.25)
            fish1.scale.x = -.25
            //fish1.tint = 0x9999FF
            //fish1.anchor.set(0.5)
            fish1.x = 400
            fish1.y = 200

        let fish2 = PIXI.Sprite.from("img/goldfish_PNG12.png")
            fish2.scale.set(.25)

        //app.stage.addChild(fish1)
        //app.stage.addChild(fish2)

        let fishContainer = new PIXI.Container()
            fishContainer.addChild(fish1)
            fishContainer.addChild(fish2)
            //fishContainer.x = 100

        app.stage.addChild(fishContainer)

        let counter = 0

        function loop() {
            counter++


            fish1.y = (Math.sin(counter/40) * 30) + 200

            requestAnimationFrame(loop)
        }

        loop()

    </script>

</body>
</html>
